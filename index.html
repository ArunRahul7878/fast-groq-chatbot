<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>fast-groq-chatbot - demo</title>
  <style>
    body{font-family:Inter,system-ui,Arial;margin:0;background:#0f1724;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh}
    .app{width:420px;background:#0b1220;border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(2,6,23,.6)}
    .header{font-weight:700;font-size:18px;margin-bottom:12px;text-align:center}
    .messages{height:360px;overflow:auto;padding:12px;background:#071025;border-radius:8px;display:flex;flex-direction:column;gap:8px}
    .msg{max-width:78%;padding:8px 10px;border-radius:10px;line-height:1.2}
    .user{align-self:flex-end;background:#1e3a8a;color:#fff;border-bottom-right-radius:2px}
    .bot{align-self:flex-start;background:#142033;color:#dbeafe;border-bottom-left-radius:2px}
    .composer{display:flex;gap:8px;margin-top:12px}
    input[type="text"]{flex:1;padding:10px;border-radius:8px;border:1px solid #183047;background:#06101a;color:#e6eef8}
    button{padding:10px 14px;border-radius:8px;border:none;background:#0ea5a0;color:#021014;font-weight:700;cursor:pointer}
    small.hint{display:block;margin-top:8px;color:#8fb0c9;text-align:center}
  </style>
</head>
<body>
  <div class="app">
    <div class="header">fast-groq-chatbot — demo</div>
    <div id="messages" class="messages" aria-live="polite"></div>

 <!-- START: composer (replace existing .composer block) -->
<div class="composer" style="flex-direction:column;gap:8px">
  <div style="display:flex;gap:8px;align-items:center">
    <!-- Provider fixed to Groq for user simplicity -->
    <label style="font-weight:600;margin-right:6px">Provider:</label>
    <select id="provider" title="Choose provider" style="padding:8px;border-radius:8px" disabled>
      <option value="groq">Groq (recommended)</option>
    </select>

    <!-- MODEL DROPDOWN (user friendly names shown) -->
    <label style="font-weight:600;margin-left:12px;margin-right:6px">Model:</label>
    <select id="model" style="padding:8px;border-radius:8px">
      <option value="llama-3.1-8b-instant">Groq — Llama 3.1 8B (cheap, fast)</option>
      <option value="llama-3.3-70b-versatile">Groq — Llama 3.3 70B (higher quality)</option>
      <option value="mixtral-8x7b-32768">Groq — Mixtral 8x7b (balanced)</option>
      <option value="openai/gpt-oss-20b">Groq — GPT-OSS 20B (OpenAI compat)</option>
    </select>

    <!-- Image upload (optional) -->
    <input id="image" type="file" accept="image/*" style="padding:8px;border-radius:8px;margin-left:12px" />
  </div>

  <div style="display:flex;gap:8px;width:100%;margin-top:8px">
    <input id="input" type="text" placeholder="Type a message and hit Enter" style="flex:1;padding:10px;border-radius:8px;border:1px solid #183047;background:#06101a;color:#e6eef8" />
    <button id="send" style="padding:10px 14px;border-radius:8px;border:none;background:#0ea5a0;color:#021014;font-weight:700;cursor:pointer">Send</button>
  </div>

  <small class="hint">Model list is curated for cost/quality tradeoffs. Add image (optional) — keep images small (&lt;1–2MB).</small>
</div>

<script>
  // helper: file -> base64 string (returns base64 without data:prefix)
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1] || null);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // main sendMessage (uses provider=groq and selected model)
  async function sendMessage(){
    const textInput = document.getElementById('input');
    const text = textInput.value;
    if(!text?.trim()) return;
    appendMessage(text, 'user');
    textInput.value = '';

    appendMessage('...', 'bot');

    const provider = document.getElementById('provider').value; // 'groq'
    const model = document.getElementById('model').value;
    const file = document.getElementById('image').files[0] || null;
    const image_b64 = await fileToBase64(file);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, provider, model, image_b64 })
      });
      const data = await res.json();

      // remove '...'
      const botPlaceholders = Array.from(messagesEl.querySelectorAll('.bot'));
      const last = botPlaceholders[botPlaceholders.length-1];
      if(last && last.textContent === '...') last.remove();

      appendMessage(data.reply || data.error || "No reply", 'bot');
    } catch (err) {
      console.error(err);
      appendMessage("Server error.", 'bot');
    }
  }

  // wire events
  sendBtn.removeEventListener('click', sendMessage); // safe no-op if not previously bound
  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>
<!-- END: composer -->

</body>
</html>
