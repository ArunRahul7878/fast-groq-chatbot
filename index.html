<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>fast-groq-chatbot - demo</title>
  <style>
    body{font-family:Inter,system-ui,Arial;margin:0;background:#0f1724;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh}
    .app{width:420px;background:#0b1220;border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(2,6,23,.6)}
    .header{font-weight:700;font-size:18px;margin-bottom:12px;text-align:center}
    .messages{height:360px;overflow:auto;padding:12px;background:#071025;border-radius:8px;display:flex;flex-direction:column;gap:8px}
    .msg{max-width:78%;padding:8px 10px;border-radius:10px;line-height:1.2}
    .user{align-self:flex-end;background:#1e3a8a;color:#fff;border-bottom-right-radius:2px}
    .bot{align-self:flex-start;background:#142033;color:#dbeafe;border-bottom-left-radius:2px}
    .composer{display:flex;gap:8px;margin-top:12px}
    input[type="text"]{flex:1;padding:10px;border-radius:8px;border:1px solid #183047;background:#06101a;color:#e6eef8}
    button{padding:10px 14px;border-radius:8px;border:none;background:#0ea5a0;color:#021014;font-weight:700;cursor:pointer}
    small.hint{display:block;margin-top:8px;color:#8fb0c9;text-align:center}
  </style>
</head>
<body>
  <div class="app">
    <div class="header">fast-groq-chatbot — demo</div>
    <div id="messages" class="messages" aria-live="polite"></div>

    <div class="composer" style="flex-direction:column;gap:8px">
  <div style="display:flex;gap:8px">
    <select id="provider" title="Choose provider" style="padding:8px;border-radius:8px">
      <option value="demo">Demo (no provider)</option>
      <option value="openai">OpenAI (cost-optimized)</option>
      <option value="gemini">Gemini</option>
      <option value="deepseek">DeepSeek</option>
      <option value="groq">Groq</option>
    </select>

    <input id="model" type="text" placeholder="model (optional)" style="padding:8px;border-radius:8px;min-width:140px" />

    <input id="image" type="file" accept="image/*" style="padding:8px;border-radius:8px" />
  </div>

  <div style="display:flex;gap:8px;width:100%">
    <input id="input" type="text" placeholder="Type a message and hit Enter" style="flex:1" />
    <button id="send">Send</button>
  </div>

  <small class="hint">Pick provider and model. Add an image (optional) — images are sent as base64 to server.</small>
</div>

<script>
  // helper: file -> base64 string
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]); // return base64 only
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // replace previous sendMessage logic with this one
  async function sendMessage(){
    const text = document.getElementById('input').value;
    if(!text.trim()) return;
    appendMessage(text, 'user');
    document.getElementById('input').value = '';

    appendMessage('...', 'bot');

    const provider = document.getElementById('provider').value;
    const model = document.getElementById('model').value || '';
    const file = document.getElementById('image').files[0] || null;
    const image_b64 = await fileToBase64(file);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, provider, model, image_b64 })
      });
      const data = await res.json();

      // remove '...'
      const botPlaceholders = Array.from(messagesEl.querySelectorAll('.bot'));
      const last = botPlaceholders[botPlaceholders.length-1];
      if(last && last.textContent === '...') last.remove();

      appendMessage(data.reply || data.error || "No reply", 'bot');
    } catch (err) {
      console.error(err);
      appendMessage("Server error.", 'bot');
    }
  }

  sendBtn.removeEventListener('click', sendMessage); // safe remove then add
  sendBtn.addEventListener('click', sendMessage);
  inputEl.removeEventListener('keydown', (e)=>{}); // harmless, then add proper handler
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
